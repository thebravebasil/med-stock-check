<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Shelf — Clinic Inventory Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Design tokens ----------
     Background:  #EAF0EC  (soft sage — clinical without being sterile white)
     Card:        #FFFFFF
     Ink:         #1B4B43  (deep teal — headings, primary actions)
     Ink-soft:    #4C6B64
     Amber:       #E8A33D  (low stock warning)
     Coral:       #E2584A  (out of stock / critical)
     Line:        #D3DED8
     Display font: Fraunces (headings)
     Body font:    IBM Plex Sans
     Data font:    IBM Plex Mono (counts, tallies)
  ------------------------------------ */
  :root{
    --bg:#EAF0EC;
    --card:#FFFFFF;
    --ink:#1B4B43;
    --ink-soft:#4C6B64;
    --amber:#E8A33D;
    --coral:#E2584A;
    --line:#D3DED8;
  }
  [data-theme="dark"]{
    --bg:#12211D;
    --card:#1B322C;
    --ink:#E8F1EC;
    --ink-soft:#9BB5AC;
    --amber:#F0B458;
    --coral:#F0776A;
    --line:#2C4A41;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:40px 20px 80px;
  }
  header{
    margin-bottom:32px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
  }
  .header-actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }
  .icon-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-btn:hover{ background:var(--bg); }

  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .toolbar button, .toolbar select{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  .toolbar button:hover{ background:var(--bg); }

  .item-notes{
    width:100%;
    margin-top:6px;
    padding:6px 8px;
    font-size:12px;
    border:1px solid var(--line);
    border-radius:6px;
    background:var(--bg);
    color:var(--ink-soft);
    font-family:'IBM Plex Sans', sans-serif;
  }
  .item-notes:focus{ color:var(--ink); }

  .undo-toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(0);
    background:var(--ink);
    color:var(--bg);
    padding:10px 16px;
    border-radius:10px;
    font-size:13px;
    display:flex;
    gap:14px;
    align-items:center;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
    z-index:10;
  }
  .undo-toast button{
    background:none;
    border:none;
    color:var(--amber);
    font-weight:600;
    cursor:pointer;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:38px;
    margin:0 0 8px;
    line-height:1.05;
  }
  .sub{
    color:var(--ink-soft);
    font-size:15px;
    margin:0;
    max-width:46ch;
  }

  /* Add-item card */
  .add-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    margin-bottom:28px;
  }
  .add-card h2{
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:600;
    margin:0 0 14px;
  }
  .add-row{
    display:grid;
    grid-template-columns:2fr 1.1fr 0.8fr 0.8fr auto;
    gap:10px;
  }
  @media (max-width: 640px){
    .add-row{grid-template-columns:1fr 1fr; }
    .add-row button{grid-column:1 / -1;}
  }
  label{
    display:block;
    font-size:11px;
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:5px;
  }
  input, select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    color:var(--ink);
    background:#fff;
  }
  input:focus, select:focus, button:focus{
    outline:2px solid var(--ink);
    outline-offset:1px;
  }
  .add-row button{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    height:38px;
    margin-top:19px;
  }
  .add-row button:hover{ opacity:0.9; }

  /* Filter bar */
  .filter-bar{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:16px;
  }
  .filter-bar input[type="search"]{
    flex:1;
  }
  .filter-bar select{
    max-width:160px;
  }

  /* Shelf list */
  .shelf-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin:22px 0 10px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }
  .item{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .vial{
    width:26px;
    height:52px;
    border:2px solid var(--ink);
    border-top:none;
    border-radius:0 0 8px 8px;
    position:relative;
    flex-shrink:0;
    background:#fff;
    overflow:hidden;
  }
  .vial::before{
    content:"";
    position:absolute;
    top:-2px; left:-4px; right:-4px;
    height:5px;
    background:var(--ink);
    border-radius:2px;
  }
  .vial-fill{
    position:absolute;
    bottom:0; left:0; right:0;
    background:var(--fill-color, var(--ink));
    transition:height 0.25s ease;
  }
  .item-main{
    flex:1;
    min-width:0;
  }
  .item-name{
    font-weight:600;
    font-size:15px;
    margin:0 0 2px;
  }
  .item-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .badge{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
    padding:3px 8px;
    border-radius:20px;
    margin-left:8px;
    letter-spacing:0.03em;
  }
  .badge.low{ background:#FCEFD9; color:#9C6A16; }
  .badge.out{ background:#FBE1DD; color:var(--coral); }

  .qty-controls{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .qty-controls button{
    width:30px; height:30px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    font-size:16px;
    line-height:1;
    cursor:pointer;
    color:var(--ink);
  }
  .qty-controls button:hover{ background:var(--bg); }
  .qty-num{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:16px;
    min-width:28px;
    text-align:center;
  }
  .remove-btn{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .remove-btn:hover{ color:var(--coral); }

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-family:'Fraunces', serif;
    font-size:17px;
    border:1px dashed var(--line);
    border-radius:14px;
  }

  footer{
    margin-top:48px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">Community Health Project</p>
      <h1>Supply Shelf</h1>
      <p class="sub">A simple inventory tracker for clinic supplies — add items, track quantities, and see at a glance what's running low.</p>
    </div>
    <div class="header-actions">
      <button id="theme-toggle" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <section class="add-card">
    <h2>Add a supply item</h2>
    <div class="add-row">
      <div>
        <label for="in-name">Item name</label>
        <input id="in-name" type="text" placeholder="e.g. Nitrile gloves (box)">
      </div>
      <div>
        <label for="in-category">Category</label>
        <select id="in-category">
          <option>PPE</option>
          <option>Bandages</option>
          <option>Medication</option>
          <option>Equipment</option>
          <option>Cleaning</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label for="in-qty">Quantity</label>
        <input id="in-qty" type="number" min="0" value="10">
      </div>
      <div>
        <label for="in-threshold">Low at</label>
        <input id="in-threshold" type="number" min="0" value="3">
      </div>
      <button id="add-btn">Add item</button>
    </div>
  </section>

  <div class="filter-bar">
    <input type="search" id="search" placeholder="Search supplies…">
    <select id="filter-category">
      <option value="all">All categories</option>
      <option>PPE</option>
      <option>Bandages</option>
      <option>Medication</option>
      <option>Equipment</option>
      <option>Cleaning</option>
      <option>Other</option>
    </select>
  </div>

  <div class="toolbar">
    <select id="sort-select">
      <option value="urgent">Sort: most urgent first</option>
      <option value="name">Sort: name (A–Z)</option>
      <option value="qty">Sort: quantity (low to high)</option>
      <option value="restocked">Sort: last restocked</option>
    </select>
    <button id="export-btn">⬇ Export shopping list (CSV)</button>
  </div>

  <div id="list"></div>

  <footer>
    Supply Shelf — built as a student community project. Data is stored only in this browser (no server, no patient data).
  </footer>

</div>

<script>
/*
  ---- How this works (for the person reading/learning the code) ----
  1. `items` is our list of supplies, stored as an array of objects.
  2. We save it to the browser's localStorage every time it changes, so
     your data is still there if you close the tab and come back.
  3. `render()` clears the list on screen and redraws it based on `items`,
     applying the current search text, category filter, and sort order.
  4. Each item shows a "vial" — a little bar that fills up based on how
     full its stock is compared to a max reference amount.
  5. `lastRestocked` gets stamped automatically whenever you increase a
     quantity, since that's the moment supplies were actually topped up.
  6. Deleting an item doesn't remove it right away — it's held in
     `pendingUndo` for a few seconds so you can undo a misclick.
*/

const STORAGE_KEY = "supply-shelf-items";
const THEME_KEY = "supply-shelf-theme";

let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let pendingUndo = null; // { item, timeoutId }

// If it's someone's very first time, seed a couple of example items
// so the page isn't confusingly empty.
if (items.length === 0) {
  const today = new Date().toISOString().slice(0, 10);
  items = [
    { id: cryptoId(), name: "Nitrile gloves (box)", category: "PPE", qty: 8, threshold: 3, max: 20, notes: "", lastRestocked: today },
    { id: cryptoId(), name: "Adhesive bandages", category: "Bandages", qty: 2, threshold: 5, max: 30, notes: "", lastRestocked: today },
    { id: cryptoId(), name: "Alcohol wipes", category: "Cleaning", qty: 15, threshold: 5, max: 20, notes: "", lastRestocked: today }
  ];
  save();
}

function cryptoId() {
  return Math.random().toString(36).slice(2, 10);
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function formatDate(dateStr) {
  if (!dateStr) return "never";
  const [y, m, d] = dateStr.split("-");
  return `${m}/${d}/${y}`;
}

// ---------- Dark mode ----------
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme-toggle").textContent = theme === "dark" ? "☀️" : "🌙";
  localStorage.setItem(THEME_KEY, theme);
}
applyTheme(localStorage.getItem(THEME_KEY) || "light");
document.getElementById("theme-toggle").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  applyTheme(current === "dark" ? "light" : "dark");
});

// ---------- CSV export ----------
function exportCSV() {
  const lowItems = items.filter(item => item.qty <= item.threshold);
  const rows = [["Item", "Category", "Current Qty", "Low-Stock At", "Notes"]];
  lowItems.forEach(item => {
    rows.push([item.name, item.category, item.qty, item.threshold, item.notes || ""]);
  });
  const csv = rows.map(row =>
    row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")
  ).join("\n");

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `supply-shelf-shopping-list-${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
document.getElementById("export-btn").addEventListener("click", exportCSV);

// ---------- Undo delete ----------
function removeItemWithUndo(id) {
  const index = items.findIndex(i => i.id === id);
  if (index === -1) return;
  const [removed] = items.splice(index, 1);
  save();
  render();
  showUndoToast(removed);
}

function showUndoToast(removedItem) {
  const existing = document.querySelector(".undo-toast");
  if (existing) existing.remove();
  if (pendingUndo) clearTimeout(pendingUndo.timeoutId);

  const toast = document.createElement("div");
  toast.className = "undo-toast";
  toast.innerHTML = `<span>Removed "${escapeHtml(removedItem.name)}"</span><button id="undo-btn">Undo</button>`;
  document.body.appendChild(toast);

  const timeoutId = setTimeout(() => {
    toast.remove();
    pendingUndo = null;
  }, 5000);

  pendingUndo = { item: removedItem, timeoutId };

  toast.querySelector("#undo-btn").addEventListener("click", () => {
    items.push(removedItem);
    save();
    render();
    clearTimeout(timeoutId);
    toast.remove();
    pendingUndo = null;
  });
}

function statusOf(item) {
  if (item.qty <= 0) return "out";
  if (item.qty <= item.threshold) return "low";
  return "ok";
}

function fillColor(status) {
  if (status === "out") return "var(--coral)";
  if (status === "low") return "var(--amber)";
  return "var(--ink)";
}

function sortItems(list) {
  const sortBy = document.getElementById("sort-select").value;
  const sorted = [...list];
  if (sortBy === "name") {
    sorted.sort((a, b) => a.name.localeCompare(b.name));
  } else if (sortBy === "qty") {
    sorted.sort((a, b) => a.qty - b.qty);
  } else if (sortBy === "restocked") {
    sorted.sort((a, b) => (a.lastRestocked || "").localeCompare(b.lastRestocked || ""));
  } else {
    // "urgent": out of stock first, then low stock, then ok — each group by qty ascending
    const rank = { out: 0, low: 1, ok: 2 };
    sorted.sort((a, b) => rank[statusOf(a)] - rank[statusOf(b)] || a.qty - b.qty);
  }
  return sorted;
}

function render() {
  const list = document.getElementById("list");
  const query = document.getElementById("search").value.trim().toLowerCase();
  const catFilter = document.getElementById("filter-category").value;

  let filtered = items.filter(item => {
    const matchesQuery = item.name.toLowerCase().includes(query);
    const matchesCat = catFilter === "all" || item.category === catFilter;
    return matchesQuery && matchesCat;
  });
  filtered = sortItems(filtered);

  list.innerHTML = "";

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">Nothing here yet. Add a supply above to start tracking your shelf.</div>`;
    return;
  }

  // Group by category for a shelf-by-shelf feel (groups appear in the
  // order their first item was sorted into, so "most urgent" still
  // surfaces the most urgent category first)
  const groups = {};
  const groupOrder = [];
  filtered.forEach(item => {
    if (!groups[item.category]) {
      groups[item.category] = [];
      groupOrder.push(item.category);
    }
    groups[item.category].push(item);
  });

  groupOrder.forEach(category => {
    const label = document.createElement("div");
    label.className = "shelf-label";
    label.textContent = category;
    list.appendChild(label);

    groups[category].forEach(item => {
      const status = statusOf(item);
      const fillPct = Math.max(0, Math.min(100, (item.qty / item.max) * 100));

      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `
        <div class="vial">
          <div class="vial-fill" style="height:${fillPct}%; --fill-color:${fillColor(status)};"></div>
        </div>
        <div class="item-main">
          <p class="item-name">${escapeHtml(item.name)}
            ${status === "low" ? '<span class="badge low">low stock</span>' : ""}
            ${status === "out" ? '<span class="badge out">out of stock</span>' : ""}
          </p>
          <p class="item-meta">low-stock alert at ${item.threshold} &nbsp;·&nbsp; restocked ${formatDate(item.lastRestocked)} &nbsp;·&nbsp; <button class="remove-btn" data-id="${item.id}">remove</button></p>
          <input type="text" class="item-notes" data-id="${item.id}" placeholder="Add a note…" value="${escapeHtml(item.notes || "")}">
        </div>
        <div class="qty-controls">
          <button data-action="dec" data-id="${item.id}">−</button>
          <span class="qty-num">${item.qty}</span>
          <button data-action="inc" data-id="${item.id}">+</button>
        </div>
      `;
      list.appendChild(row);
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// Event: add new item
document.getElementById("add-btn").addEventListener("click", () => {
  const nameInput = document.getElementById("in-name");
  const name = nameInput.value.trim();
  if (!name) {
    nameInput.focus();
    return;
  }
  const category = document.getElementById("in-category").value;
  const qty = parseInt(document.getElementById("in-qty").value, 10) || 0;
  const threshold = parseInt(document.getElementById("in-threshold").value, 10) || 0;
  const max = Math.max(qty, threshold * 4, 10); // reference point for the vial fill

  items.push({ id: cryptoId(), name, category, qty, threshold, max, notes: "", lastRestocked: todayStr() });
  save();
  render();

  nameInput.value = "";
  nameInput.focus();
});

// Event delegation: qty buttons + remove buttons
document.getElementById("list").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const id = btn.dataset.id;

  if (btn.classList.contains("remove-btn")) {
    removeItemWithUndo(id);
    return;
  }

  const item = items.find(i => i.id === id);
  if (!item) return;

  if (btn.dataset.action === "inc") {
    item.qty += 1;
    item.lastRestocked = todayStr(); // an increase counts as a restock
  }
  if (btn.dataset.action === "dec") {
    item.qty = Math.max(0, item.qty - 1);
  }

  save();
  render();
});

// Event delegation: notes field (typing updates the item's notes)
document.getElementById("list").addEventListener("input", (e) => {
  if (!e.target.classList.contains("item-notes")) return;
  const item = items.find(i => i.id === e.target.dataset.id);
  if (!item) return;
  item.notes = e.target.value;
  save();
});

// Search + filter + sort
document.getElementById("search").addEventListener("input", render);
document.getElementById("filter-category").addEventListener("change", render);
document.getElementById("sort-select").addEventListener("change", render);

render();
</script>
</body>
</html>
